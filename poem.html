<!DOCTYPE html>
<html>
<head>
<title>Lisu — Words</title>

<style>
body{
  margin:0;
  height:100vh;
  background:linear-gradient(to bottom,#ffffff,#fff5f8);
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Poppins',sans-serif;
  color:#333;
}
.box{
  width:420px;
  padding:35px;
  background:#ffffff;
  border-radius:25px;
  box-shadow:0 30px 60px rgba(0,0,0,0.1);
  text-align:center;
}
.poem{
  margin-top:30px;
  line-height:1.9;
  min-height:220px;
}
button{
  margin-top:30px;
  padding:12px 35px;
  border-radius:50px;
  border:none;
  cursor:pointer;
  background:linear-gradient(45deg,#ff9a9e,#fad0c4);
}
</style>
</head>

<body>

<audio id="bgMusic" loop>
  <source src="bg.mp3" type="audio/mpeg">
</audio>

<div class="box">
  <h2>LiSU 🤍</h2>
  <div class="poem" id="poem"></div>
  <button onclick="next()">Continue →</button>
</div>

<script>
const music=document.getElementById("bgMusic");
if(localStorage.getItem("music")==="on"){ music.play(); }

const lines=[
  "Some people enter your life quietly,",
  "without asking for attention.",
  "",
  "And suddenly,",
  "everything inside you feels lighter.",
  "",
  "You are that feeling, My GurlyPop."
];

let i=0,j=0;
const p=document.getElementById("poem");

function type(){
  if(i<lines.length){
    if(j<lines[i].length){
      p.innerHTML+=lines[i][j++];
      setTimeout(type,45);
    }else{
      p.innerHTML+="<br>";
      j=0;i++;
      setTimeout(type,400);
    }
  }
}
type();

function next(){
  window.location.href="book.html";
}
</script>

</body>
</html>
